[project]
name = "mcp-aws-finops"
version = "0.1.0"
description = "Read-only MCP server that answers AWS cost (FinOps) questions for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thomas Silva Cordeiro" }]
keywords = ["mcp", "aws", "finops", "cost", "ai-agents", "focus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "mcp>=1.2.0,<2",
  "pydantic>=2.8",
  "duckdb>=1.1",
  "boto3>=1.35",
]

[project.urls]
Homepage = "https://github.com/thomm-011/mcp-aws-finops"
Repository = "https://github.com/thomm-011/mcp-aws-finops"

[project.scripts]
mcp-aws-finops = "mcp_aws_finops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_aws_finops"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_aws_finops/data/sample_focus.parquet" = "mcp_aws_finops/data/sample_focus.parquet"

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "pre-commit>=4.0",
  "boto3-stubs>=1.35",
  "moto[cloudwatch,ec2]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_aws_finops"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/mcp_aws_finops"]

[tool.coverage.report]
fail_under = 80
show_missing = true
